[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trimreaper"
dynamic = ["version"]
description = "Reclaims the disk that AI coding agents leave behind (clones, worktrees, build output, tool caches, scratch, evidence), removing only what it can prove is disposable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Michael Berardi" }]
keywords = ["disk-cleanup", "ai-agents", "agent-swarm", "git", "garbage-collection", "macos"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/michael-berardi/TrimReaper"
Issues = "https://github.com/michael-berardi/TrimReaper/issues"

[project.scripts]
trimreaper = "trimreaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "trimreaper.__version__" }
